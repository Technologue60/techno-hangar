<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand défi · Statique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0614;--pn:rgba(26,15,43,.80);--pn2:#1a0f2b;--ln:rgba(183,123,255,.20);--tx:#f6f0ff;--mu:#ab9cc8;--a1:#b77bff;--a2:#d8b4ff;--g1:#ffd23f;--g2:#ff9f1c;--ok:#45f0a6;--ko:#ff5c7c;--or:#ff9a3d;--gold:#ffd23f;--vi:#b07cff;--display:"Space Grotesk","Segoe UI",sans-serif;--body:"Atkinson Hyperlegible",Verdana,sans-serif;--mono:"JetBrains Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--body)}
body{overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 20% 15%,rgba(140,60,255,.28),transparent 70%),radial-gradient(35% 30% at 85% 25%,rgba(255,200,60,.10),transparent 70%),radial-gradient(45% 40% at 60% 95%,rgba(90,40,200,.22),transparent 70%);animation:aur 22s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.45;background-image:radial-gradient(rgba(200,170,255,.18) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:linear-gradient(#000,transparent 85%);mask-image:linear-gradient(#000,transparent 85%)}
@keyframes aur{50%{transform:translate(3%,-2%) rotate(4deg)}100%{transform:translate(-3%,2%) rotate(-3deg)}}
@keyframes shine{to{background-position:-200% 0}}
h1,h2,.qt,.chip,.node small,.btn{font-family:var(--display)}
.cnt,.meta,#chrono{font-family:var(--mono)!important}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:840px;margin:0 auto;padding:10px 12px 40px}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 10px;gap:10px}
.top .tt b{font-size:13px;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.top .tt span{margin-left:10px;color:var(--mu);font-size:13px}
.meta{display:flex;gap:8px;align-items:center;font:13px ui-monospace,Menlo,monospace;color:var(--mu)}
.meta button{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:3px 8px}
.tag{white-space:nowrap;font:12px system-ui;padding:2px 8px;border-radius:99px;border:1px solid var(--ln)}
.tag.ap{color:var(--gold);border-color:rgba(245,183,74,.5)}

/* ---------- échelle des paliers ---------- */
.ladder{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:16px 10px 12px;border:1px solid var(--ln);border-radius:16px;
 background:radial-gradient(90% 120% at 50% 0%,rgba(183,123,255,.16),transparent 60%),rgba(16,9,28,.75)}
.ladder .rail{position:absolute;left:10%;right:10%;top:36px;height:3px;background:var(--ln);border-radius:2px}
.ladder .rail b{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,var(--g1),var(--a2));box-shadow:0 0 12px rgba(183,123,255,.6);transition:width .8s cubic-bezier(.2,.9,.2,1)}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.node .hx{width:42px;height:42px;display:grid;place-items:center;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);background:#24163d;color:var(--mu);font:700 15px ui-monospace,monospace;transition:background .4s,color .4s,transform .4s}
.node{transition:transform .35s cubic-bezier(.2,.9,.2,1)}
.node .hw{position:relative;filter:drop-shadow(0 0 0 transparent);transition:filter .4s}
.node .hx{position:relative;overflow:hidden}
.node .hx::after{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.node.done .hx{background:linear-gradient(135deg,#fff3b0 0%,var(--g1) 35%,var(--g2) 100%);color:#3a2600;font-size:18px}
.node.done .hw{filter:drop-shadow(0 0 10px rgba(255,190,40,.55))}
.node.done small{color:var(--g1)}
.node.done .dots i{background:var(--g1)}
.node:hover{transform:translateY(-3px)}
.node:hover .hx::after{transform:translateX(130%)}
.node.done:hover .hw{filter:drop-shadow(0 0 18px rgba(255,190,40,.9))}
.node.done .hx{animation:or 3.2s ease-in-out infinite}
@keyframes or{50%{background-position:100% 0;filter:brightness(1.12)}}
.node.cur .hw{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 12px rgba(183,123,255,.7))}}
.node.gagne .hx{animation:gain .9s cubic-bezier(.3,1.6,.4,1)}
@keyframes gain{0%{transform:scale(.4) rotate(-90deg)}100%{transform:none}}
.node.cur .hx{background:#35205c;color:var(--tx);box-shadow:0 0 0 2px var(--a2) inset;transform:scale(1.12)}
.node.cur .hx{outline:2px solid var(--a2)}
.node small{font-size:11.5px;line-height:1.2;color:var(--mu);max-width:120px}
.node.cur small{color:var(--tx);font-weight:600}
.node .dots{display:flex;gap:3px;height:6px}
.node .dots i{width:6px;height:6px;border-radius:50%;background:#33224f}
.node .dots i.f{background:var(--a2)}
.node.done .dots i{background:var(--a2)}
@media (max-width:560px){.node small{display:none}.node.cur small{display:block;position:absolute;top:58px;white-space:nowrap}.ladder{padding-bottom:30px}}

/* ---------- carte ---------- */
main{margin-top:12px}
.card{position:relative;overflow:hidden;background:var(--pn);backdrop-filter:blur(8px);border:1px solid var(--ln);border-radius:18px;padding:18px}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--a1),var(--a2))}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--ln);color:var(--a2)}
.cnt{font:12px ui-monospace,monospace;color:var(--mu)}
.ctx{margin:0 0 8px;padding:7px 10px;border-radius:10px;background:var(--pn2);color:var(--mu);font-size:13px}
.ctx b{color:var(--tx)}
.qt{position:relative;font-size:17px;font-weight:600;margin:4px 0 14px;padding:12px 16px 12px 18px;color:#ffe9a8;background:linear-gradient(90deg,rgba(255,210,63,.13),rgba(255,210,63,.02));border:1px solid rgba(255,210,63,.28);border-left:4px solid var(--g1);border-radius:12px}
.qt::before{content:"QUESTION";display:block;font:700 10.5px/1 var(--mono);letter-spacing:.18em;color:var(--g2);margin-bottom:6px}
.qt b{color:#fff}
.rep{position:relative;margin:4px 0 0;padding:28px 14px 14px;border:1.5px solid rgba(183,123,255,.55);border-radius:14px;background:linear-gradient(180deg,rgba(183,123,255,.12),rgba(183,123,255,.04));box-shadow:inset 0 0 24px rgba(183,123,255,.08)}
.rep::before{content:"TA RÉPONSE";position:absolute;top:9px;left:14px;font:700 10.5px/1 var(--mono);letter-spacing:.18em;color:var(--a2)}
.rep .opt,.rep .tagc,.rep .numrow input,.rep .bsel select,.rep .acro input{background:#120a20}
.rep .opt:hover:not(:disabled){border-color:var(--a1)}
.fig{background:#0d0818;border:1px solid var(--ln);border-radius:12px;padding:6px;margin:0 0 12px}
.fig svg{display:block;width:100%;height:auto;max-height:360px}
.fig .hint{font-size:12px;color:var(--mu);text-align:center;padding:2px 0 4px}
.fig.clic svg{cursor:crosshair}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--pn2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:#3e4454}
.opt.sel{border-color:var(--a1);box-shadow:0 0 0 1px var(--a1) inset}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .opt{padding:8px 12px}
.numrow{display:flex;align-items:center;gap:8px}
.numrow input{width:180px;background:var(--pn2);border:1px solid var(--ln);border-radius:10px;color:var(--tx);font:16px ui-monospace,monospace;padding:9px 11px}
.numrow input:focus{outline:none;border-color:var(--a1)}
.numrow span{color:var(--mu)}
.tors{display:flex;align-items:center;gap:6px;font:16px ui-monospace,monospace}
.tors .br{font-size:64px;line-height:1;color:var(--mu);font-weight:200}
.tg{display:grid;grid-template-columns:repeat(2,52px);gap:6px}
.tg button{height:38px;background:var(--pn2);border:1px solid var(--ln);border-radius:9px;font:600 16px ui-monospace,monospace}
.tg button.z{color:var(--ko);border-color:rgba(255,93,108,.5);background:rgba(255,93,108,.08)}
.tors .pt{color:var(--mu);font-size:13px;align-self:flex-end;margin-bottom:12px}
.bame{width:100%;border-collapse:separate;border-spacing:6px}
.bame th{font-size:12px;color:var(--mu);font-weight:600;text-align:center}
.bame th:first-child{text-align:left}
.bame td:first-child{font-weight:700}
.bame td button{width:100%;height:38px;border-radius:9px;border:1px solid var(--ln);background:var(--pn2);font-weight:700}
.trous{font-size:16px;line-height:2.5}
.trous p.trou{margin:0 0 6px}
.slot{min-width:110px;border:1px dashed var(--a2);background:rgba(183,123,255,.06);color:var(--mu);border-radius:8px;padding:2px 10px;margin:0 3px;font:inherit;line-height:1.6}
.slot.f{border-style:solid;color:var(--tx);font-weight:600}
.slot.on{box-shadow:0 0 0 2px var(--a1)}
.bame.tete .slot{width:100%;min-width:0;margin:0;font-size:13px;line-height:1.3;padding:6px 4px}
.bame.tete td{text-align:center;color:var(--mu);line-height:1.4}
.tagz{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;min-height:36px}
.tagc{background:var(--pn2);border:1px solid var(--ln);border-radius:99px;padding:6px 14px}
.tagc:hover{border-color:var(--a2)}
.rec{display:grid;gap:8px;margin:0 0 12px}
.rec div{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rec b{min-width:170px;font-size:13px}
.rec span{display:flex;flex-wrap:wrap;gap:6px}
.rq{width:38px;height:34px;border-radius:9px;border:1px dashed var(--ko);background:none;color:var(--ko);font-weight:700}
.rq.ok{border:1px solid var(--a2);color:#04131a;background:var(--a2)}
.rq.lk{border:1px solid var(--ln);color:var(--mu);background:var(--pn2)}
.fb.ok{color:var(--ok)}
.burst{position:fixed;left:0;top:0;pointer-events:none;z-index:60;width:7px;height:7px;border-radius:50%;animation:bu .8s cubic-bezier(.15,.8,.3,1) forwards}
.burst.sq{border-radius:2px}
@keyframes bu{to{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.2);opacity:0}}
.ripple{position:fixed;pointer-events:none;z-index:59;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid var(--g1);animation:rp .55s ease-out forwards}
@keyframes rp{to{transform:scale(7);opacity:0}}
.node.done .dots i,.node.done .dots i.f{background:var(--g1);box-shadow:0 0 6px rgba(255,200,60,.7)}
.node.done .hx{font-size:22px}
.pal>div{text-align:center}
.pal .hx{background:linear-gradient(135deg,#fff3b0,var(--g1) 40%,var(--g2))!important;color:#3a2600!important;filter:drop-shadow(0 0 18px rgba(255,190,40,.7))}
.tsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.tsteps div{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;border:1px solid var(--ln);background:var(--pn2);color:var(--mu);font-size:13px;transition:all .3s}
.tsteps i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#24163d;color:var(--a2);font:700 12px var(--mono)}
.tsteps div.on{border-color:var(--g1);color:var(--tx);box-shadow:0 0 0 1px var(--g1) inset,0 0 18px -6px var(--g1);transform:translateY(-2px)}
.tsteps div.on i{background:var(--g1);color:#3a2600}
.tsteps div.fait{color:var(--tx)}
.tsteps div.fait i{background:var(--a1);color:#fff}
.demo{position:relative;padding:28px 14px 6px;border:1.5px dashed rgba(255,210,63,.45);border-radius:16px;background:rgba(0,0,0,.18);overflow:hidden;min-height:340px}
.demo .dtag{position:absolute;top:9px;left:14px;font:700 10.5px/1 var(--mono);letter-spacing:.18em;color:var(--g1)}
.demo button{pointer-events:none}
.tfig{display:flex;justify-content:center;margin:-4px 0 6px}
.curs{position:absolute;z-index:5;left:92%;top:95%;transition:left .8s cubic-bezier(.5,0,.2,1),top .8s cubic-bezier(.5,0,.2,1),opacity .4s,transform .15s;filter:drop-shadow(0 3px 6px rgba(0,0,0,.6))}
.curs.press{transform:scale(.8)}
.dtoast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--pn2);border:1px solid var(--a2);color:var(--a2);padding:7px 14px;border-radius:99px;font-weight:600;animation:pop .4s}
.btn.go-t.pret{animation:prete 1.6s ease-in-out infinite}
@keyframes prete{50%{box-shadow:0 0 0 6px rgba(255,210,63,.18),0 10px 30px -8px var(--g2)}}
.sortw,.veil p.sortw{color:var(--ko);font-weight:700}
@media (max-width:560px){.tsteps{grid-template-columns:1fr}}
.tgrid{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
.tgrid>.fig svg{max-height:260px}
@media (max-width:700px){.tgrid{grid-template-columns:1fr}}
.tgrid>.fig{position:static}
.tgrid>.fig svg{transform-origin:14% 40%}
.tgrid>.fig svg.equi{animation:equi 1.3s ease}
@keyframes equi{0%,100%{filter:none}40%{filter:drop-shadow(0 0 14px #45f0a6) brightness(1.15)}}
.tgrid>.fig svg.tombe{animation:tombe 1.4s cubic-bezier(.5,0,.6,1)}
@keyframes tombe{0%{transform:none}55%{transform:translateX(-14px) rotate(-16deg);filter:drop-shadow(0 0 12px #ff5c7c)}75%{transform:translateX(-14px) rotate(-16deg)}100%{transform:none}}
.tracer{padding-top:30px}
.tbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tb{background:#120a20;border:1px solid var(--ln);border-radius:9px;padding:6px 10px;font-size:13px}
.tb.on{border-color:var(--g1);color:var(--g1);box-shadow:0 0 0 1px var(--g1) inset}
.tsc{margin-left:auto;font:12px var(--mono);color:var(--mu)}
.tfig2{margin:0;background:#0d0818}
.tmes{margin:8px 0 0;font:12.5px var(--mono);color:var(--g1)}
.acro{display:grid;gap:8px}
.acro div{display:flex;align-items:center;gap:6px}
.acro b{font:800 30px/1 ui-monospace,monospace;width:30px;color:var(--a2)}
.acro input{flex:1;max-width:320px;background:var(--pn2);border:0;border-bottom:2px solid var(--ln);color:var(--tx);font:18px system-ui;padding:6px 4px}
.acro input:focus{outline:none;border-bottom-color:var(--a1)}
.pk line{stroke:transparent;stroke-width:26;cursor:pointer;pointer-events:stroke}
.pk line:hover{stroke:rgba(183,123,255,.18)}
.bsel select{width:100%;background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:9px;padding:8px 6px;font:inherit}
.bsel select.v{border-color:var(--a2)}
.bame td button.k{border-color:rgba(63,214,154,.55);color:var(--ok);background:rgba(63,214,154,.08)}
.act{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--ln);flex-wrap:wrap}
.btn.nav{background:transparent;color:var(--a2);border:1.5px solid rgba(183,123,255,.6);box-shadow:none}
.btn.nav:hover:not(:disabled){background:rgba(183,123,255,.14);box-shadow:0 8px 22px -10px var(--a1)}
.btn.nav.suiv{color:#f6f0ff;border-color:rgba(246,240,255,.45)}
.btn.nav.suiv:hover:not(:disabled){background:rgba(246,240,255,.10);box-shadow:0 8px 22px -10px #fff}
.act .fb{flex-basis:100%;order:9}
.btn{position:relative;overflow:hidden;border:0;border-radius:999px;padding:10px 20px;font-weight:700;color:#1a1203;background:linear-gradient(90deg,var(--g1),var(--g2));box-shadow:0 6px 20px rgba(255,163,26,.22)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.btn:hover:not(:disabled)::after{transform:translateX(120%)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 28px -8px var(--g2)}
.btn{transition:transform .2s,box-shadow .2s}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);box-shadow:none}
.btn.lien{background:none;border:0;box-shadow:none;color:var(--mu);padding:10px 6px;text-decoration:underline}
.fb{font-weight:600}.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}.fb.mu{color:var(--mu)}
.corr{margin:12px 0 0;padding:8px 10px;border-radius:10px;border:1px dashed var(--ko);color:#ff8a95;font-size:14px}
sub{font-size:.7em}
.saved{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--pn2);border:1px solid var(--a2);color:var(--a2);padding:8px 16px;border-radius:99px;font-weight:600;z-index:20}

/* intro / bilan */
.intro h1{margin:0 0 6px;font:700 28px/1.15 var(--display);background:linear-gradient(90deg,#fff,var(--a1) 45%,var(--a2));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.intro p{color:var(--mu);margin:0 0 12px}
.regles{display:grid;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.regles li{display:flex;gap:10px;align-items:center;padding:9px 12px;background:var(--pn2);border:1px solid var(--ln);border-radius:12px}
.regles i{font-style:normal;font-size:18px;width:24px;text-align:center}
.regles li.w{border-color:rgba(255,93,108,.45)}
.big{font:800 46px/1 ui-monospace,monospace;margin:6px 0}
.big small{font-size:20px;color:var(--mu)}
.bars{display:grid;gap:8px;margin:14px 0}
.bars div{display:grid;grid-template-columns:170px 1fr 48px;gap:8px;align-items:center;font-size:13px}
.bars em{height:8px;border-radius:5px;background:var(--pn2);overflow:hidden}
.bars em b{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2))}

/* bandeau palier + sortie */
.veil{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(5,6,9,.82);backdrop-filter:blur(3px);padding:20px}
.veil .box{max-width:440px;text-align:center;background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:22px}
.veil .box.w{border-color:var(--ko);box-shadow:0 0 40px rgba(255,93,108,.25)}
.veil h2{margin:6px 0 6px}
.veil p{color:var(--mu);margin:0 0 14px}
.pal{animation:pal 2.2s forwards}
.pal .hx{width:74px;height:74px;margin:0 auto;display:grid;place-items:center;clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%);background:linear-gradient(135deg,var(--a1),var(--a2));color:#1a1203;font:800 26px ui-monospace,monospace;animation:pop .7s cubic-bezier(.3,1.6,.4,1)}
.pal b{display:block;margin-top:10px;font:800 13px/1 system-ui;letter-spacing:.2em;color:var(--a2)}
.pal span{display:block;margin-top:6px;font-size:20px;font-weight:700}
@keyframes pal{0%{opacity:0}10%{opacity:1}82%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg)}100%{transform:none}}

/* pilotage prof */
.pilot h2{margin:0 0 10px;font-size:18px}
.sw{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.sw label{display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--pn2);cursor:pointer}
.sw label.on{border-color:var(--a2)}
.big-sw{font-weight:700}
.tab{width:100%;border-collapse:collapse;font-size:13px}
.tab th{text-align:left;color:var(--mu);font-weight:600;padding:6px;border-bottom:1px solid var(--ln)}
.tab td{padding:7px 6px;border-bottom:1px solid #1d2029}
.tab .w{color:var(--ko);font-weight:700}
.tab tr.flash td{animation:flash 1.2s 3}
@keyframes flash{50%{background:rgba(255,92,124,.18)}}
.sw select{background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:3px 6px;font:inherit}
.tab button{background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:2px 8px;font-size:12px}
.qstat{display:grid;gap:5px;margin-top:8px}
.qstat div{display:grid;grid-template-columns:190px 1fr 70px;gap:8px;align-items:center;font-size:12px}

<body>
<div id="app">
 <header class="top">
  <div class="tt"><b>Grand défi</b><span>Statique</span></div>
  <div class="meta"><span id="sorties"></span><span id="mode"></span><span id="chrono"></span><button id="fs" type="button" title="Plein écran">⛶</button></div>
 </header>
 <section class="ladder" id="ladder"></section>
 <main id="main"></main>
</div>

<script>
/* =====================================================================
   Grand défi de fin de séquence · Statique (Terminale STI2D)
   Sur le site : réponses envoyées au serveur (RPC defi_*), corrigées côté serveur,
   une seule réponse par question, sortie de page détectée.
   ===================================================================== */
const SECOURS=/*SECOURS*/null;
const PROF_NAV=false;
const RESS_DEF='terminale-sti2d/defi-statique-eleve.html';
const PAL=[null,
 {n:'Le PFS',i:'Énoncé et conséquences'},
 {n:'Décrire une action',i:'Notation et caractéristiques'},
 {n:'Modéliser',i:'Les actions mécaniques'},
 {n:'Isoler',i:'BAME pas à pas · potence'},
 {n:'Cas pratique',i:'Méthode graphique · potence'}];
const NP=PAL.length-1;
const CTX={pot:'Potence : charge <b>P = 1200 N</b> en D · 0 mur, 1 poutre, 2 jambe de force · poids des pièces négligés',
 ech:'Échelle appuyée contre un mur : <b>P = 800 N</b> en G (peintre + échelle) · contact en B sans frottement · frottement au sol en A · 0 mur et sol, 1 échelle'};
const V=(l,i)=>`${l}<sub>${i}</sub>`;

const Q=[

 {id:'p1',p:1,type:'tags',ord:1,q:'Complète l\'énoncé du PFS avec les étiquettes.',tpl:'<p class="trou">Un solide est en {0} si la somme des actions mécaniques {1} qui s\'exercent sur lui est {2}.</p>',tags:['équilibre','mouvement','extérieures','intérieures','nulle','maximale']},
 {id:'p2',p:1,type:'tags',ord:1,q:'Complète les deux conséquences du PFS.',tpl:'<p class="trou">La somme des {0} est nulle : le solide ne se {1} pas.</p><p class="trou">La somme des {2} est nulle : le solide ne {3} pas.</p>',tags:['forces','moments','déplace','tourne','masses','déforme']},
 {id:'b4',p:1,type:'qcm',q:'Solide en équilibre sous l\'action de 2 forces : ces forces ont…',o:['même direction, même intensité, sens contraires','même point d\'application et même sens','des directions perpendiculaires','seulement la même intensité']},
 {id:'b6',p:1,type:'tags',ord:1,q:'Complète la condition d\'équilibre d\'un solide soumis à 3 forces non parallèles.',tpl:'<p class="trou">Les 3 forces sont {0} : leurs directions se coupent en un même point I.</p><p class="trou">Le {1} des forces (triangle des forces) est {2}.</p>',tags:['concourantes','parallèles','dynamique','moment','fermé','ouvert']},

 {id:'b2',p:2,type:'qcm',fig:'a12',q:`Sur ce schéma, ${V('A','1/2')} désigne :`,o:['l\'action de 1 sur 2 au point A','l\'action de 2 sur 1 au point A','la distance entre 1 et 2 en A','le moment en A de 2 sur 1']},
 {id:'b3',p:2,type:'tags',fig:'a12',q:'Complète l\'en-tête du tableau avec les 4 caractéristiques d\'une action mécanique.',tpl:'<table class="bame tete"><tr><th>Action</th><th>{0}</th><th>{1}</th><th>{2}</th><th>{3}</th></tr><tr><td>A<sub>1/2</sub></td><td>…</td><td>…</td><td>…</td><td>…</td></tr></table>',tags:['point d\'application','direction','sens','intensité','masse','vitesse']},
 {id:'b5',p:2,type:'mots',lettres:['B','A','M','E'],q:'Ce tableau s\'appelle un BAME. Complète chaque mot.'},

 {id:'m1',p:3,type:'num',fig:'caisse',q:'Caisse de masse m = 45 kg (g = 9,81 m/s²). Son poids P ?',u:'N'},
 {id:'m5',p:3,type:'click',fig:'vec',q:'Représente le poids P à l\'échelle : clique sur l\'extrémité de la flèche.'},
 {id:'m2',p:3,type:'qcm',fig:'ponct',q:`Contact ponctuel <b>sans frottement</b> en A entre le rouleau 1 et le plan incliné 0 : la direction de ${V('A','0/1')} est…`,o:['perpendiculaire (normale) au plan, en A','parallèle au plan incliné','verticale','horizontale']},
 {id:'m4',p:3,type:'qcm',fig:'cable',q:'Le câble (poids négligé) soulève la caisse. Il exerce sur elle une action…',o:['selon la direction du câble, qui tire','perpendiculaire au câble','selon le câble, qui pousse','toujours verticale']},

 {id:'i1',p:4,type:'pick',cas:'pot',fig:'pot',f:{pick:1},q:'<b>Étape 1</b> · Isole la jambe de force 2 : clique sur la pièce.'},
 {id:'i2',p:4,isoFrom:'i1',type:'qcm',ns:1,cas:'pot',fig:'pot',f:{iso:'2'},q:'<b>Étape 2</b> · Combien d\'actions mécaniques extérieures s\'exercent sur la jambe de force 2 ?',o:['1','2','3','4']},
 {id:'i3',p:4,isoFrom:'i1',type:'qcm',cas:'pot',fig:'pot',f:{iso:'2'},q:'<b>Étape 3</b> · La jambe de force 2 est un…',o:['solide soumis à 2 forces','solide soumis à 3 forces non parallèles','solide soumis à 3 forces parallèles','solide soumis à 4 forces']},
 {id:'i4',p:4,isoFrom:'i1',type:'bsel',cas:'pot',fig:'pot',f:{iso:'2'},q:'<b>Étape 4</b> · Complète le BAME de la jambe de force 2.',rows:[V('B','1/2'),V('C','0/2')]},
 {id:'i5',p:4,type:'pick',cas:'pot',fig:'pot',f:{pick:1},q:'<b>Étape 5</b> · Isole maintenant la poutre 1 : clique sur la pièce.'},
 {id:'i6',p:4,isoFrom:'i5',type:'qcm',ns:1,cas:'pot',fig:'pot',f:{iso:'1'},q:'<b>Étape 6</b> · Combien d\'actions mécaniques extérieures s\'exercent sur la poutre 1 ?',o:['1','2','3','4']},
 {id:'i7',p:4,isoFrom:'i5',type:'bsel',cas:'pot',fig:'pot',f:{iso:'1'},q:'<b>Étape 7</b> · Complète le BAME de la poutre 1.',rows:['P',V('B','2/1'),V('A','0/1')]},
 {id:'i8',p:4,isoFrom:'i5',type:'qcm',cas:'pot',fig:'pot',f:{iso:'1'},q:'<b>Étape 8</b> · La poutre 1 est un…',o:['solide soumis à 2 forces','solide soumis à 3 forces non parallèles','solide soumis à 3 forces parallèles','solide soumis à 4 forces']},
 {id:'e1',p:5,type:'click',cas:'pot',fig:'pot',f:{grid:1},q:'La poutre 1 est soumise à 3 forces. Clique sur leur point de concours I.'},
 {id:'e2',p:5,type:'qcm',cas:'pot',fig:'pot',f:{},q:`Direction de ${V('A','0/1')} ?`,o:['la droite (AI)','la droite (AD)','la verticale en A','la droite (AC)']},
 {id:'e3',p:5,type:'trace',cas:'pot',q:`Trace le dynamique (triangle des forces) de la poutre 1, puis vérifie si elle est en équilibre. <b>3 essais.</b>`}


];
const LAB={"b2": "Notation A1/2", "b3": "Caractéristiques (tableau)", "b4": "Solide soumis à 2 forces", "m1": "Calcul du poids", "m2": "Contact ponctuel (plan incliné)", "m4": "Action d'un câble", "p1": "Énoncé du PFS", "p2": "Conséquences du PFS", "b5": "BAME : compléter les mots", "m5": "Tracer P à l'échelle", "i1": "Isoler la jambe de force 2", "i2": "Nb d'actions sur 2", "i3": "2 : solide soumis à 2 forces", "i4": "BAME de la jambe de force 2", "i5": "Isoler la poutre 1", "i6": "Nb d'actions sur 1", "i7": "BAME de la poutre 1", "i8": "1 : solide soumis à 3 forces", "e1": "Point de concours I (potence)", "e2": "Direction de A0/1", "e3": "Tracé du dynamique (3 essais)", "b6": "Solide soumis à 3 forces"};
const N=Q.length,PN=Array(NP+1).fill(0);Q.forEach(q=>PN[q.p]++);

/* ---------- contexte : site (élève / prof), secours, aperçu ---------- */
const TS=(()=>{try{return window.parent!==window&&parent.TH&&parent.TH_ACCES?{TH:parent.TH,me:parent.TH_ACCES}:null;}catch(e){return null;}})();
const RESS=(()=>{try{return new URLSearchParams(parent.location.search).get('r')||RESS_DEF;}catch(e){return RESS_DEF;}})();
let MODE=PROF_NAV?'apercu':TS?(TS.me.role==='eleve'?'serveur':TS.me.role==='prof'?'prof':'apercu'):(SECOURS?'secours':'apercu');
const PRENOM=TS?(TS.me.prenom||''):'';
let CLES=SECOURS||null; // prof : chargées depuis le serveur pour l'aperçu

/* ---------- correction (secours / aperçu prof), identique au serveur ---------- */
function juste(c,r){
 try{
  if(r==null)return false;
  if(c.t==='qcm'||c.t==='txt')return String(r)===String(c.a);
  if(c.t==='seq')return Array.isArray(r)&&r.length===c.a.length&&r.every((v,k)=>v===c.a[k]);
  if(c.t==='num'){const x=Number(r);return isFinite(x)&&Math.abs(x-c.a)<=Math.max(Math.abs(c.a)*(c.tol||.03),.5);}
  if(c.t==='set'){const a=[...new Set(r.map(String))].sort(),b=[...new Set(c.a.map(String))].sort();return a.length===b.length&&a.every((v,k)=>v===b[k]);}
  if(c.t==='mots'){const n=x=>String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'').replace(/s$/,'');return Array.isArray(r)&&r.length===c.a.length&&r.every((w,k)=>n(w)===c.a[k]||n(String(w).slice(1))===c.a[k]);}
  if(c.t==='dyn')return dynCheck(r&&r.v,c).ok;
  if(c.t==='pt')return Math.hypot(r[0]-c.a[0],r[1]-c.a[1])<=c.tol;
 }catch(e){}
 return false;
}

/* ---------- API : même interface pour le serveur et le mode local ---------- */
const LSK='defi-statique-secours';
const loc={rep:{},sorties:0,rendu:false};
if(MODE==='secours'){try{Object.assign(loc,JSON.parse(localStorage.getItem(LSK)||'{}'));}catch(e){}}
const saveLoc=()=>{if(MODE==='secours')try{localStorage.setItem(LSK,JSON.stringify(loc))}catch(e){}};
function bilanLocal(){
 const pal=PAL.slice(1).map((_,k)=>k+1).map(p=>({palier:p,total:PN[p],justes:Q.filter(q=>q.p===p&&loc.rep[q.id]&&loc.rep[q.id].j).length}));
 const j=pal.reduce((s,x)=>s+x.justes,0);
 return {score:Math.round(j/N*200)/10,paliers:pal};
}
const API={
 async etat(){
  if(MODE==='serveur')return await TS.TH.rpc('defi_mon_etat',{p_ressource:RESS});
  const reps={},verrous=[],essais={};for(const k in loc.rep){if(loc.rep[k].s)verrous.push(k);else reps[k]=loc.rep[k].r;if(loc.rep[k].e)essais[k]={n:loc.rep[k].e,ok:loc.rep[k].j};}
  return Object.assign({essais,ouvert:true,sortie_zero:MODE==='secours',sortie_max:MODE==='secours'?3:0,montrer_score:true,reps,verrous,rendu:loc.rendu,sorties:loc.sorties},loc.rendu&&CLES?bilanLocal():{});
 },
 async repondre(qid,r){
  if(MODE==='serveur')return await TS.TH.rpc('defi_repondre',{p_ressource:RESS,p_qid:qid,p_reponse:r});
  if(loc.rendu)return {ok:false,raison:'rendu'};
  if(loc.rep[qid]&&loc.rep[qid].s)return {ok:false,raison:'verrou'};
  const c=CLES&&CLES[qid],old=loc.rep[qid];
  if(c&&c.max){if(old&&(old.j||old.e>=c.max))return {ok:false,raison:'essais'};const j=juste(c,r),e=((old&&old.e)||0)+1;loc.rep[qid]={r,j,e};saveLoc();return {ok:true,juste:j,essais:e};}
  loc.rep[qid]={r,j:c?juste(c,r):false};saveLoc();return {ok:true};
 },
 async rendre(){
  if(MODE==='serveur')return await TS.TH.rpc('defi_rendre',{p_ressource:RESS});
  loc.rendu=true;saveLoc();return {ok:true};
 },
 async sortie(qid){
  if(MODE==='serveur')return await TS.TH.rpc('defi_sortie',{p_ressource:RESS,p_qid:qid});
  if(MODE!=='secours')return {zero:false};
  loc.sorties++;if(qid)loc.rep[qid]={r:null,j:false,s:1};let rendu=false;if(loc.sorties>=3){loc.rendu=true;rendu=true;}saveLoc();return {zero:!!qid,rendu};
 }
};

/* ---------- état de la page ---------- */
let E=null;          // état renvoyé par le serveur
let I=0;             // index de la question affichée
let SCR='charge';    // charge | intro | q | recap | fin | ferme | pilot
let R={};            // réponse en cours (non envoyée)
let BUSY=false,T0=null,MES={};
const $=s=>document.querySelector(s);
const fr=(n,d=1)=>n.toFixed(d).replace('.',',');
const norm=x=>{x.reps=x.reps||{};x.verrous=x.verrous||[];x.essais=x.essais||{};return x;};
const done=id=>!!E&&(E.reps&&E.reps[id]!=null||E.verrous&&E.verrous.includes(id));
const locked=id=>!!E&&E.verrous&&E.verrous.includes(id);
const firstOpen=()=>{const k=Q.findIndex(q=>!done(q.id));return k<0?N:k;};
function fromRep(q,r){
 if(r==null)return undefined;
 switch(q.type){case 'trace':return {lines:[],vecs:(r&&r.v||[]).map(v=>v.slice())};case 'qcm':return Number(r);case 'num':return String(r);case 'mots':return r.map(w=>String(w).slice(1));default:return Array.isArray(r)?r.slice():r;}
}
function openQ(i){
 const prev=SCR==='q'?Q[I].p:0;I=Math.max(0,Math.min(N-1,i));const q=Q[I];
 R={};MES={};if(MODE!=='apercu'||!PROF_NAV){const v=fromRep(q,E.reps[q.id]);if(v!==undefined)R.v=v;}
 SCR='q';render();window.scrollTo({top:0,behavior:'smooth'});
 if(q.p!==prev)palier(q.p);
}

/* ---------- dessin ---------- */
function arr(x1,y1,x2,y2,col,w=3,h=11){
 const a=Math.atan2(y2-y1,x2-x1),bx=x2-h*Math.cos(a),by=y2-h*Math.sin(a),px=Math.sin(a)*h*.45,py=-Math.cos(a)*h*.45;
 return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/><polygon points="${x2},${y2} ${bx+px},${by+py} ${bx-px},${by-py}" fill="${col}"/>`;
}
function sens(cx,cy){
 const R=13,p=t=>[cx+R*Math.cos(t*Math.PI/180),cy-R*Math.sin(t*Math.PI/180)],[sx,sy]=p(-60),[ex,ey]=p(200);
 const t=200*Math.PI/180,dx=-Math.sin(t),dy=-Math.cos(t);
 return `<g><path d="M${sx} ${sy}A${R} ${R} 0 1 0 ${ex} ${ey}" fill="none" stroke="#3b8bff" stroke-width="2"/>${arr(ex-dx*.1,ey-dy*.1,ex+dx*7,ey+dy*7,'#3b8bff',2,7)}<text x="${cx}" y="${cy+5}" text-anchor="middle" fill="#3b8bff" font-size="15" font-weight="700">+</text></g>`;
}
const T=(x,y,s,o='')=>`<text x="${x}" y="${y}" ${o}>${s}</text>`;
const sb=(l,i)=>`${l}<tspan font-size="70%" dy="4">${i}</tspan>`;
const LBL='fill="#e9ebf1" font-size="15" font-weight="700"';

function pot(f={}){
 const s=80,ox=70,oy=140,X=x=>ox+x*s,Y=y=>oy-y*s;
 let g='';
 if(f.grid){
  for(let x=-.25;x<=5.26;x+=.25){const m=Math.abs(x-Math.round(x))<.01;g+=`<line x1="${X(x)}" y1="${Y(1.5)}" x2="${X(x)}" y2="${Y(-2.6)}" stroke="${m?'#2b3140':'#191d26'}"/>`}
  for(let y=-2.5;y<=1.51;y+=.25){const m=Math.abs(y-Math.round(y))<.01;g+=`<line x1="${X(-.25)}" y1="${Y(y)}" x2="${X(5.25)}" y2="${Y(y)}" stroke="${m?'#2b3140':'#191d26'}"/>`}
 }
 const sel=f.iso||f.sel,op=p=>f.iso&&f.iso!==p?.18:1,cc=(p,c)=>sel===p?'#ffd23f':c;
 g+=`<g opacity="${op('0')}"><line x1="${X(0)}" y1="${Y(1.2)}" x2="${X(0)}" y2="${Y(-2.6)}" stroke="${cc('0','#aab2c3')}" stroke-width="2.5"/>`;
 for(let y=1.1;y>-2.6;y-=.2)g+=`<line x1="${X(0)}" y1="${Y(y)}" x2="${X(-.16)}" y2="${Y(y-.16)}" stroke="${cc('0','#6d7586')}" stroke-width="1.2"/>`;
 g+='</g>';
 if(f.cand){
  const L=(a,b,c,d,col,n,lx,ly)=>`<line x1="${X(a)}" y1="${Y(b)}" x2="${X(c)}" y2="${Y(d)}" stroke="${col}" stroke-width="2.4" stroke-dasharray="8 6"/><text x="${X(lx)}" y="${Y(ly)}" fill="${col}" font-size="15" font-weight="700">${n}</text>`;
  g+=L(-.2,-2.4,4.2,.9,'#ff9a3d','①',4.25,.95)+L(3,-2.45,3,1.3,'#b07cff','②',3.1,1.25)+L(-.1,.06,5.1,.06,'#ff6fb0','③',4.75,.25);
 }
 if(f.bc)g+=`<line x1="${X(-.2)}" y1="${Y(-2.4)}" x2="${X(3.4)}" y2="${Y(.3)}" stroke="#ff9a3d" stroke-width="2" stroke-dasharray="7 6" opacity=".9"/>`;
 if(f.constr){
  g+=`<line x1="${X(4)}" y1="${Y(-1.3)}" x2="${X(4)}" y2="${Y(1.3)}" stroke="#ff7a5c" stroke-width="2" stroke-dasharray="7 6"/>`;
  g+=`<line x1="${X(-.2)}" y1="${Y(-2.4)}" x2="${X(4.4)}" y2="${Y(1.05)}" stroke="#ff9a3d" stroke-width="2" stroke-dasharray="7 6"/>`;
  g+=`<circle cx="${X(4)}" cy="${Y(.75)}" r="5" fill="#f5b74a"/>`+T(X(4.12),Y(.82),'I','fill="#f5b74a" font-size="16" font-weight="700"');
 }
 g+=`<line opacity="${op('2')}" x1="${X(0)}" y1="${Y(-2.25)}" x2="${X(3)}" y2="${Y(0)}" stroke="${cc('2','#707a91')}" stroke-width="10" stroke-linecap="round"/>`;
 g+=`<g opacity="${op('1')}"><line x1="${X(0)}" y1="${Y(0)}" x2="${X(4.12)}" y2="${Y(0)}" stroke="${cc('1','#949db1')}" stroke-width="13"/><line x1="${X(0)}" y1="${Y(.05)}" x2="${X(4.12)}" y2="${Y(.05)}" stroke="#c3cad8" stroke-width="2" opacity=".5"/></g>`;
 [[0,0],[3,0],[0,-2.25],[4,0]].forEach(([x,y],k)=>{g+=k<3?`<circle cx="${X(x)}" cy="${Y(y)}" r="7" fill="#13151b" stroke="#dfe4ee" stroke-width="2"/>`:`<circle cx="${X(x)}" cy="${Y(y)}" r="3.5" fill="#dfe4ee"/>`});
 g+=T(X(.12),Y(.2),'A',LBL)+T(X(2.9),Y(.2),'B',LBL)+T(X(.15),Y(-2.42),'C',LBL)+T(X(3.86),Y(.2),'D',LBL);
 const num=(x,y,n)=>`<circle cx="${X(x)}" cy="${Y(y)}" r="10" fill="none" stroke="#8a90a0"/>`+T(X(x),Y(y)+5,n,'text-anchor="middle" fill="#8a90a0" font-size="13"');
 g+=num(1.6,-.33,'1')+num(1.85,-1.05,'2')+num(-.45,-2.45,'0');
 g+=`<g opacity="${op('1')}">`+arr(X(4),Y(0)+7,X(4),Y(-1.15),'#ff7a5c',3.5,13)+T(X(4.12),Y(-.95),'P','fill="#ff7a5c" font-size="16" font-weight="700"')+'</g>';
 const dh=(a,b,y,t)=>arr(X((a+b)/2),Y(y),X(a),Y(y),'#6f7688',1,7)+arr(X((a+b)/2),Y(y),X(b),Y(y),'#6f7688',1,7)+`<line x1="${X(a)}" y1="${Y(y-.1)}" x2="${X(a)}" y2="${Y(y+.1)}" stroke="#6f7688"/><line x1="${X(b)}" y1="${Y(y-.1)}" x2="${X(b)}" y2="${Y(y+.1)}" stroke="#6f7688"/>`+T(X((a+b)/2),Y(y)-5,t,'text-anchor="middle" fill="#8a90a0" font-size="12"');
 g+=dh(0,3,1.3,'3 m')+dh(3,4,1.3,'1 m');
 g+=arr(X(-.55),Y(-1.1),X(-.55),Y(0),'#6f7688',1,7)+arr(X(-.55),Y(-1.1),X(-.55),Y(-2.25),'#6f7688',1,7)+T(X(-.62),Y(-1.12),'2,25 m',`text-anchor="middle" fill="#8a90a0" font-size="12" transform="rotate(-90 ${X(-.62)} ${Y(-1.12)})"`);

const nb=v=>{if(v==null)return null;const m=String(v).replace(/\s/g,'').replace(/−/g,'-').replace(',','.').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null;};
function lireReponse(q){

  case 'num':{const x=nb(v);return x==null?undefined:x;}
  case 'grid':return v&&v.length?v.slice():undefined;
  case 'bame':return v||'000000000';
  case 'tags':return v&&v.every(x=>x)?v.slice():undefined;
  case 'click':return v?v.slice():undefined;
  case 'bsel':return v&&v.every(x=>x)?v.slice():undefined;

/* Enregistrement automatique : si l'élève a saisi une réponse complète puis change de question sans cliquer « Enregistrer » */
async function autoSave(){

 const q=Q[I];if(!q||q.type==='trace'||locked(q.id))return true;
 const r=lireReponse(q);if(r===undefined)return true;
 if(JSON.stringify(r)===JSON.stringify(E.reps[q.id]))return true;
 BUSY=true;
 try{const x=await API.repondre(q.id,r);BUSY=false;
  if(x&&x.ok===false){if(x.raison==='verrou'&&!E.verrous.includes(q.id))E.verrous.push(q.id);return true;}
  E.reps[q.id]=r;toast('Réponse enregistrée');return true;}
 catch(e){BUSY=false;const f=$('#fb');if(f){f.className='fb ko';f.textContent='Connexion perdue : réponse non enregistrée. Réessaie.';}return false;}
}

async function envoyer(q){

 if(r===undefined){const f=$('#fb');f.className='fb mu';f.textContent=q.type==='click'?'Clique sur la figure.':q.type==='num'?'Entre une valeur.':q.type==='tags'?'Place une étiquette dans chaque case.':q.type==='mots'?'Complète les 4 mots.':q.type==='bsel'?'Remplis toutes les cases du tableau.':q.type==='pick'?'Clique sur une pièce.':'Choisis une réponse.';return;}
 BUSY=true;$('#val').disabled=true;
 try{
  const x=await API.repondre(q.id,r);
  BUSY=false;
  if(x&&x.ok===false){
   if(x.raison==='ferme'){SCR='ferme';render();return;}
   if(x.raison==='rendu'){E=norm(await API.etat());SCR='fin';render();return;}
   if(x.raison==='verrou'){if(!E.verrous.includes(q.id))E.verrous.push(q.id);delete E.reps[q.id];question();return;}
   throw new Error(x.raison||'refus');
  }
  E.reps[q.id]=r;toast('Réponse enregistrée');suivant();
 }catch(e){
  BUSY=false;const f=$('#fb');if(f){f.className='fb ko';f.textContent='Connexion perdue : réponse non enregistrée. Réessaie.';}const v=$('#val');if(v)v.disabled=false;
 }
}

/* ---------- animations ---------- */
const COLS=['#ffd23f','#ff9f1c','#c99bff','#ffe9a8','#ffffff'];
function eclat(x,y,n=14,force=60){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const r=document.createElement('div');r.className='ripple';r.style.left=x+'px';r.style.top=y+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),600);
 for(let i=0;i<n;i++){const e=document.createElement('i');e.className='burst'+(i%3?'':' sq');const a=Math.random()*Math.PI*2,d=force*(.4+Math.random());
  e.style.cssText=`left:${x-3}px;top:${y-3}px;background:${COLS[i%COLS.length]};box-shadow:0 0 8px ${COLS[i%COLS.length]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--r:${Math.random()*360}deg`;
  document.body.appendChild(e);setTimeout(()=>e.remove(),850);}
}
function pluie(){for(let k=0;k<6;k++)setTimeout(()=>eclat(innerWidth*(.15+Math.random()*.7),innerHeight*(.2+Math.random()*.4),22,140),k*160);}

 <div class="qstat">${Q.map(q=>{const s=qs.find(x=>x.qid===q.id)||{n:0,justes:0};const v=s.n?Math.round(s.justes/s.n*100):0;return `<div><span>${q.p} · ${LAB[q.id]}</span><em><b class="${s.n&&v<50?'lo':''}" style="width:${v}%"></b></em><span>${s.n?v+' % ('+s.n+')':'–'}</span></div>`}).join('')}</div>
 <div class="act"><button class="btn" id="ram">📥 Ramasser toutes les copies</button><button class="btn sec" id="ap">Aperçu élève (avec réponses)</button><button class="btn sec" id="rf">↻ Actualiser</button></div></div>`;
 m.querySelectorAll('.sw input').forEach(i=>i.onchange=()=>regler(i.dataset.k,i.checked));
 $('#smax').onchange=e=>regler('sortie_max',+e.target.value);
 m.querySelectorAll('[data-raz]').forEach(b=>b.onclick=async()=>{if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Confirmer ?';return;}
  try{await TS.TH.rpc('defi_reinitialiser',{p_ressource:RESS,p_eleve:b.dataset.raz});}catch(e){alertePilot(e.message);}chargerPilot();});
 $('#ap').onclick=()=>{MODE='apercu';loc.rep={};loc.rendu=false;E=norm({ouvert:true,sortie_zero:false,montrer_score:true,sorties:0});SCR='intro';render();};
 $('#rf').onclick=chargerPilot;
 $('#ram').onclick=async e=>{const b=e.currentTarget;if(!b.dataset.ok){b.dataset.ok=1;b.textContent='Confirmer : ramasser toutes les copies en cours';return;}
  try{const n=await TS.TH.rpc('defi_rendre_tous',{p_ressource:RESS});chargerPilot();setTimeout(()=>alertePilot(n+' copie(s) ramassée(s).'),300);}catch(err){alertePilot(err.message);}};
}

/* ---------- démarrage ---------- */
async function demarrer(){
 if(MODE==='prof'){SCR='pilot';render();chargerPilot();TIMER=setInterval(()=>{if(SCR==='pilot')chargerPilot();},5000);return;}
 try{E=await API.etat();}catch(e){$('#main').innerHTML='<div class="card"><p class="fb ko">Serveur injoignable. Recharge la page.</p></div>';return;}
 if(E.erreur){$('#main').innerHTML=`<div class="card"><p class="fb ko">${E.erreur}</p></div>`;return;}
 norm(E);
 if(E.rendu){SCR='fin';}else if(!E.ouvert){SCR='ferme';}else SCR='intro';
 render();
}
// le défi fermé se met à jour seul ; une fermeture en cours de route arrête l'élève
setInterval(async()=>{
 if(MODE!=='serveur'||!['ferme','q','intro','recap'].includes(SCR))return;
 try{const x=norm(await API.etat());const ouvre=SCR==='ferme'&&x.ouvert;const reps=E&&E.reps;E=x;if(reps&&SCR==='q')Object.assign(E.reps,reps);
  if(x.rendu){SCR='fin';render();}else if(ouvre){SCR='intro';render();}else if(!x.ouvert&&SCR!=='ferme'&&!ALERTE){SCR='ferme';render();}}catch(e){}
},5000);
setInterval(()=>{if(!T0||SCR!=='q')return;const t=Math.round((Date.now()-T0)/1000);$('#chrono').textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;},1000);
$('#fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}catch(e){}};
render();demarrer();
</script>
</body>
