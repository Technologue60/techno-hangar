<script>
/* Si la carte reste vide, on le dit au lieu de ne rien afficher */
setTimeout(function () {
  var q = document.getElementById("quiz");
  if (q && !q.children.length && document.documentElement.classList.contains("th-ok"))
    q.innerHTML = '<p style="padding:1.2rem;color:#ff9a3d;font-size:.9rem">La question du jour n\'a pas pu se charger. Fais Ctrl+F5, puis vérifie que le dossier assets (quiz.js, quiz.css, quiz-scene.jpg, site.js) est bien à jour sur GitHub.</p>';
}, 5000);
</script>
